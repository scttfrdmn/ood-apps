---
cluster: "aws-sagemaker-training"
form:
  - job_name
  - algorithm_image
  - instance_type
  - instance_count
  - volume_size_gb
  - walltime
  - input_s3
  - output_s3
  - role_arn
attributes:
  job_name:
    label: "Training Job Name"
    value: "ood-training-job"
    help: "Must be unique — used as the job ID"
  algorithm_image:
    label: "Algorithm Image (ECR URI)"
    value: ""
    help: "ECR URI for the training container (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-trainer:latest)"
  instance_type:
    label: "Instance Type"
    widget: select
    options:
      - ["ml.m5.xlarge (4 vCPU, 16 GB)", "ml.m5.xlarge"]
      - ["ml.m5.4xlarge (16 vCPU, 64 GB)", "ml.m5.4xlarge"]
      - ["ml.p3.2xlarge (8 vCPU, 61 GB, 1x V100)", "ml.p3.2xlarge"]
      - ["ml.p3.8xlarge (32 vCPU, 244 GB, 4x V100)", "ml.p3.8xlarge"]
      - ["ml.p3dn.24xlarge (96 vCPU, 768 GB, 8x V100)", "ml.p3dn.24xlarge"]
      - ["ml.p4d.24xlarge (96 vCPU, 1152 GB, 8x A100)", "ml.p4d.24xlarge"]
    value: "ml.p3.2xlarge"
  instance_count:
    widget: number_field
    label: "Instance Count"
    value: 1
    min: 1
    max: 32
  volume_size_gb:
    widget: number_field
    label: "EBS Volume Size (GB)"
    value: 50
    min: 10
    max: 1024
  walltime:
    label: "Max Runtime (HH:MM:SS)"
    value: "24:00:00"
  input_s3:
    label: "Input S3 URI"
    value: ""
    help: "s3://bucket/prefix for training data (optional)"
  output_s3:
    label: "Output S3 URI"
    value: "s3://my-bucket/sagemaker-output/"
    help: "s3://bucket/prefix for model artifacts"
  role_arn:
    label: "Execution Role ARN"
    value: ""
    help: "IAM role for SageMaker to assume (sagemaker.amazonaws.com trusted)"
